<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GoImport</title>
  <link rel="icon" type="image/png" href="/img/favicon.png"/>
  <link rel="stylesheet" href="/style/styles.css"/>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;">
  <div style="text-align:center;max-width:320px;">
    <img src="/img/logo.png" alt="GoImport Logo" style="height:50px;margin-bottom:16px;">
    <h1 style="color:#4bc3d1;margin:0 0 8px;font-size:1.4rem;">GoImport</h1>
    <p style="margin:0 0 20px;color:#555;font-size:.95rem;line-height:1.4;">
      Bienvenido. Próximamente más servicios.
      <br><br>
      ¿Necesitás una cotización urgente?
    </p>
    <a href="/cotizaciones" style="
       display:inline-block;
       background:#4bc3d1;
       color:#fff;
       font-weight:600;
       text-decoration:none;
       border-radius:10px;
       padding:12px 16px;
       font-size:1rem;">
      Ir al cotizador
    </a>
  </div>
</body>
</html>
